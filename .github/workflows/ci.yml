name: CI

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
    inputs:
      upload:
        description: Upload this build to TestFlight (uses the release environment secrets)
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

defaults:
  run:
    shell: bash

jobs:
  gates:
    name: Privacy and project gates
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Project file matches its generator
        run: python3 scripts/gen_xcodeproj.py --check
      - name: Source lint (G-04)
        run: python3 scripts/lint_sources.py
      - name: Dependency allowlist (G-06)
        run: python3 scripts/check_dependencies.py
      - name: Privacy manifest (G-07)
        run: python3 scripts/check_privacy_manifest.py
      - name: Capability allowlist (G-08)
        run: python3 scripts/check_capabilities.py

  core-linux:
    name: Core tests on Linux (G-03)
    runs-on: ubuntu-latest
    container: swift:6.1
    steps:
      - uses: actions/checkout@v4
      - run: swift test --package-path Core

  ios:
    name: Build, test and scan (G-01, G-02, G-05)
    needs: gates
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Toolchain
        run: |
          sw_vers
          xcodebuild -version
      - name: Core tests on macOS
        run: swift test --package-path Core
      - name: Pick a simulator
        id: sim
        run: echo "udid=$(python3 scripts/pick_simulator.py)" >> "$GITHUB_OUTPUT"
      - name: Build and test on the simulator
        run: |
          xcodebuild test \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -configuration Debug \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd" \
            -resultBundlePath "$RUNNER_TEMP/LocalGallery-tests.xcresult" \
            CODE_SIGNING_ALLOWED=NO
      # A plain build, apart from the test run: `xcodebuild test` copies Xcode's own
      # test frameworks (XCTest, XCUnit…) into the app it hosts tests in, and those
      # are not the app. The scan reads what ships, with no exceptions in it.
      - name: Build the app alone (Release, simulator)
        run: |
          xcodebuild build \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -configuration Release \
            -destination "platform=iOS Simulator,id=${{ steps.sim.outputs.udid }}" \
            -derivedDataPath "$RUNNER_TEMP/dd-app" \
            CODE_SIGNING_ALLOWED=NO
      - name: Networking-symbol scan of the app build
        run: python3 scripts/scan_network_symbols.py "$RUNNER_TEMP/dd-app/Build/Products/Release-iphonesimulator/LocalGallery.app"
      - name: Keep the test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: ${{ runner.temp }}/LocalGallery-tests.xcresult
          retention-days: 7
          if-no-files-found: ignore

  testflight:
    name: Upload to TestFlight
    if: (github.event_name == 'workflow_dispatch' && inputs.upload) || startsWith(github.ref, 'refs/tags/v')
    needs: [gates, core-linux, ios]
    runs-on: macos-26
    environment: release
    steps:
      - uses: actions/checkout@v4

      # Archive UNSIGNED; the export signs once, with Apple's cloud-managed distribution
      # certificate. Signing the archive would make automatic signing mint a new development
      # certificate on every run (each runner starts with an empty keychain).
      - name: Archive (unsigned)
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
        run: |
          xcodebuild archive \
            -project LocalGallery.xcodeproj \
            -scheme LocalGallery \
            -configuration Release \
            -destination "generic/platform=iOS" \
            -archivePath "$RUNNER_TEMP/LocalGallery.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            LG_TEAM_ID="$TEAM_ID" \
            CURRENT_PROJECT_VERSION="${{ github.run_number }}"

      - name: Networking-symbol scan of the release binary
        run: python3 scripts/scan_network_symbols.py "$RUNNER_TEMP/LocalGallery.xcarchive/Products/Applications/LocalGallery.app" | tee "$RUNNER_TEMP/network-scan.txt"

      - name: Upload to App Store Connect
        env:
          TEAM_ID: ${{ vars.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          python3 scripts/write_export_options.py "$TEAM_ID" "$RUNNER_TEMP/ExportOptions.plist"
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/LocalGallery.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"

      - name: Publish the network scan with this build
        uses: actions/upload-artifact@v4
        with:
          name: network-scan-build-${{ github.run_number }}
          path: ${{ runner.temp }}/network-scan.txt

      - name: Remove signing material
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/asc.p8"

name: App Store Connect build status

# Read-only: lists app records and build processing states. Run it from the Actions tab.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  status:
    runs-on: ubuntu-latest
    environment: release
    steps:
      - uses: actions/checkout@v4
      - name: Query App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          umask 077
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc.p8"
          ASC_KEY_PATH="$RUNNER_TEMP/asc.p8" python3 scripts/asc_build_status.py
          rm -f "$RUNNER_TEMP/asc.p8"
